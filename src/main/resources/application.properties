server.port=8080

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Route: favicon (must come first, more specific path)
spring.cloud.gateway.routes[0].id=favicon
spring.cloud.gateway.routes[0].uri=no://op
spring.cloud.gateway.routes[0].predicates[0]=Path=/favicon.ico

# Route: backend with rate limiter
spring.cloud.gateway.routes[1].id=backend
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/hello
spring.cloud.gateway.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.replenishRate=2
spring.cloud.gateway.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=2
spring.cloud.gateway.routes[1].filters[0].args.key-resolver=#{@userKeyResolver}